# secret and personal-data checks on every push and pull request:
# - gitleaks scans the full history for keys, tokens and passwords
# - private-paths fails if a local-only path (.data/, .reports/, "-" folders, route groups like (-private))
#   was committed, e.g. after a force-add or a .gitignore change
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  private-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no local-only paths are tracked
        run: |
          found=$(git ls-files | grep -E '^\.data/|^\.reports/|(^|/)-[^/]*/|(^|/)\(-[^/]*\)/' || true)
          if [ -n "$found" ]; then
            echo "::error::local-only paths are tracked, remove them with 'git rm --cached':"
            echo "$found"
            exit 1
          fi
          echo "no local-only paths tracked"
